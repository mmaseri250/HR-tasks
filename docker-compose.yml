# =========================================================================
# نظام موارد بشرية شركة جوهرة المجد - Jawharat Al-Majd HRMS
# Docker Compose Orchestration for Multi-Platform Production
# =========================================================================

version: '3.8'

services:
  hrms-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jawharat-hrms:latest
    container_name: jawharat_hrms_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/server/database
      - TZ=Asia/Riyadh
    volumes:
      # Persistent SQLite database volume & uploaded attachments
      - hrms_db_data:/app/server/database
      - hrms_uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/settings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hrms_db_data:
    name: jawharat_hrms_database_volume
  hrms_uploads_data:
    name: jawharat_hrms_uploads_volume
